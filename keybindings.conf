# Main key
$mainMod = Super

# App launcher
bind = $mainMod, C, exec, pkill -x fuzzel || fuzzel # FUZZEL

# Close focused window
bind = $mainMod, Q, killactive # CLOSES FOCUSED WINDOW

# Application shortcuts
bind = $mainMod, T, exec, foot # TERMINAL
bind = $mainMod, R, exec, helium-browser # BROWSER
bind = $mainMod, H, exec, pkill -x hyprpicker -a -f hex || hyprpicker -a -f hex # HYPRPICKER
bind = $mainMod+Ctrl, E, exec, foot -e yazi # YAZI
bind = $mainMod, E, exec, $HOME/.local/bin/ws3-layout # CUSTOM TMUX LAYOUT
bind = $mainMod, F1, exec, sh -c '$HOME/.local/bin/ws3-layout & sleep 0.15; env OZONE_PLATFORM=wayland SDL_VIDEODRIVER=wayland steam --ozone-platform=wayland & sleep 0.08; setsid vesktop --ozone-platform=wayland >/dev/null 2>&1 & sleep 0.05; setsid helium-browser >/dev/null 2>&1 &' # PRESET

# General shortcuts
bind = $mainMod, SPACE, togglefloating, # MAKE FOCUSED WINDOW FLOAT
bind = $mainMod , F, fullscreen  # MAKE FOCUSED WINDOW FULLSCREEN
bind = $mainMod, Backspace, exec, killall waybar || waybar # TURN ON/OFF WAYBAR
bind = $mainMod+Ctrl, Delete, exit, # SHUTDOWN HYPRLAND
bind = $mainMod, B, exec, ~/.local/bin/toggle-clipboard # CLIPBOARD HISTORY
bind = $mainMod, G, exec, ~/.local/bin/gamemode-toggle # GAME MODE
bind = $mainMod+Alt, H, exec, hyprctl switchxkblayout "razer-razer-blackwidow-v3-tenkeyless" next # SWITCH KB LAYOUT
bind = $mainMod, O, setprop, active opaque toggle # TOGGLE OFF WINDOW OPACITY
bind = $mainMod+Shift, E, centerwindow # MOVES FOCUSED FLOATING WINDOW TO CENTER
bind = $mainMod, Tab, cyclenext # FOCUSES THE NEXT WINDOW
bind = $mainMod, Delete, exec, ~/.local/bin/powermenu # POWER OPTIONS
bind = $mainMod, N, exec, ~/.local/bin/fuzzel-network # NETWORK OPTIONS
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%m-%S').png | wl-copy # SCREENSHOT

# Media control
bindel = $mainMod+Ctrl, Up, exec, ~/.local/bin/system-vol.sh 5%+ # INCREASE SYSTEM AUDIO
bindel = $mainMod+Ctrl, Down, exec, ~/.local/bin/system-vol.sh 5%- # DECREASE SYSTEM AUDIO
bindl = $mainMod+Ctrl, Right, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # MUTE SYSTEM AUDIO
bindl = $mainMod+Ctrl, Left, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle # MUTE MICROPHONE
bind = $mainMod+Shift, Right, exec, playerctl next --player spotify # PLAY NEXT SPOTIFY SONG
bind = $mainMod+Shift, Left, exec, playerctl previous --player spotify # PLAY PREVIOUS SPOTIFY SONG
bind = $mainMod+Shift, Down, exec, playerctl play-pause --player spotify # PAUSE SPOTIFY SONG
binde = $mainMod+Shift+Ctrl, Up, exec, ~/.local/bin/spotify-vol.sh 0.05+ # INCREASE SPOTIFY VOLUME
binde = $mainMod+Shift+Ctrl, Down, exec, ~/.local/bin/spotify-vol.sh 0.05- # DECREASE SPOTIFY VOLUME
bind = $mainMod+Shift, Up, exec, pwvucontrol -t 3 # AUDIO CONTROL PANEL

# Window management
bind = $mainMod, V, layoutmsg, togglesplit # SPLIT FOCUSED WINDOW
bindm = $mainMod, Z, movewindow # MOVE FOCUSED WINDOW
bindm = $mainMod, mouse:272, movewindow # MOVE FOCUSED WINDOW
bindm = $mainMod, X, resizewindow # RESIZE FOCUSED WINDOW
bindm = $mainMod, mouse:273, resizewindow # RESIZE FOCUSED WINDOW w/ MOUSE
binde = $mainMod, Right, resizeactive, 30 0 # RESIZE FOCUSED WINDOW w/ ARROWS RIGHT
binde = $mainMod, Left, resizeactive, -30 0 # RESIZE FOCUSED WINDOW w/ ARROWS LEFT
binde = $mainMod, Up, resizeactive, 0 -30 # RESIZE FOCUSED WINDOW w/ ARROWS UP
binde = $mainMod, Down, resizeactive, 0 30 # RESIZE FOCUSED WINDOW w/ ARROWS DOWN
bind = $mainMod+Shift, A, movewindow, l # MOVE FOCUSED WINDOW LEFT
bind = $mainMod+Shift, D, movewindow, r # MOVE FOCUSED WINDOW RIGHT
bind = $mainMod+Shift, W, movewindow, u # MOVE FOCUSED WINDOW UP
bind = $mainMod+Shift, S, movewindow, d # MOVE FOCUSED WINDOW DOWN
bind = $mainMod, A, movefocus, l # MOVE FOCUS LEFT
bind = $mainMod, D, movefocus, r # MOVE FOCUS RIGHT
bind = $mainMod, W, movefocus, u # MOVE FOCUS UP
bind = $mainMod, S, movefocus, d # MOVE FOCUS DOWN
#bind = $mainMod, M, exec, hyprctl keyword general:layout "dwindle" # SWITCH TO DWINDLE LAYOUT
#bind = $mainMod+Alt, M, exec, hyprctl keyword general:layout "master" # SWITCH TO MASTER LAYOUT
bind = $mainMod+Ctrl, D, layoutmsg, cyclenext # FOCUS NEXT WINDOW IN MONOCLE LAYOUT

# Workspaces
bind = $mainMod, 1, workspace, 1 # SWITCH TO WORKSPACE 1 
bind = $mainMod, 2, workspace, 2 # SWITCH TO WORKSPACE 2
bind = $mainMod, 3, workspace, 3 # SWITCH TO WORKSPACE 3
bind = $mainMod, 4, workspace, 4 # SWITCH TO WORKSPACE 4 
bind = $mainMod, 5, workspace, 5 # SWITCH TO WORKSPACE 5
bind = $mainMod, 6, workspace, 6 # SWITCH TO WORKSPACE 6 
bind = $mainMod, 7, workspace, 7 # SWITCH TO WORKSPACE 7
bind = $mainMod, 8, workspace, 8 # SWITCH TO WORKSPACE 8
bind = $mainMod, 9, workspace, 9 # SWITCH TO WORKSPACE 9
bind = $mainMod, 0, workspace, 10 # SWITCH TO WORKSPACE 10
bind = $mainMod, K, togglespecialworkspace, scratch # ACTIVATE SPECIAL WORKSPACE
bind = $mainMod+Shift, K, movetoworkspacesilent, special:scratch # MOVE FOCUSED WINDOW TO SPECIAL WORKSPACE
bind = $mainMod+Ctrl, 1, workspace, 11 # SWITCH TO WORKSPACE 11
bind = $mainMod+Ctrl, 2, workspace, 12 # SWITCH TO WORKSPACE 12
bind = $mainMod+Ctrl, 3, workspace, 13 # SWITCH TO WORKSPACE 13
bind = $mainMod+Ctrl, 4, workspace, 14 # SWITCH TO WORKSPACE 14
bind = $mainMod+Ctrl, 5, workspace, 15 # SWITCH TO WORKSPACE 15
bind = $mainMod+Ctrl, 6, workspace, 16 # SWITCH TO WORKSPACE 16
bind = $mainMod+Ctrl, 7, workspace, 17 # SWITCH TO WORKSPACE 17
bind = $mainMod+Ctrl, 8, workspace, 18 # SWITCH TO WORKSPACE 18
bind = $mainMod+Ctrl, 9, workspace, 19 # SWITCH TO WORKSPACE 19
bind = $mainMod+Ctrl, 0, workspace, 20 # SWITCH TO WORKSPACE 20
bind = $mainMod, mouse_down, workspace, e+1 # SCROLL THROUGH WORKSPACES w/ MOUSE
bind = $mainMod, mouse_up, workspace, e-1 # SCROLL THROUGH WORKSPACES w/ MOUSE
bind = $mainMod+Shift, 1, movetoworkspacesilent, 1 # MOVE FOCUSED WINDOW TO WORKSPACE 1 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift, 2, movetoworkspacesilent, 2 # MOVE FOCUSED WINDOW TO WORKSPACE 2 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift, 3, movetoworkspacesilent, 3 # MOVE FOCUSED WINDOW TO WORKSPACE 3 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift, 4, movetoworkspacesilent, 4 # MOVE FOCUSED WINDOW TO WORKSPACE 4 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift, 5, movetoworkspacesilent, 5 # MOVE FOCUSED WINDOW TO WORKSPACE 5 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift, 6, movetoworkspacesilent, 6 # MOVE FOCUSED WINDOW TO WORKSPACE 6 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift, 7, movetoworkspacesilent, 7 # MOVE FOCUSED WINDOW TO WORKSPACE 7 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift, 8, movetoworkspacesilent, 8 # MOVE FOCUSED WINDOW TO WORKSPACE 8 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift, 9, movetoworkspacesilent, 9 # MOVE FOCUSED WINDOW TO WORKSPACE 9 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift, 0, movetoworkspacesilent, 10 # MOVE FOCUSED WINDOW TO WORKSPACE 10 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift+Ctrl, 1, movetoworkspacesilent, 11 # MOVE FOCUSED WINDOW TO WORKSPACE 11 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift+Ctrl, 2, movetoworkspacesilent, 12 # MOVE FOCUSED WINDOW TO WORKSPACE 12 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift+Ctrl, 3, movetoworkspacesilent, 13 # MOVE FOCUSED WINDOW TO WORKSPACE 13 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift+Ctrl, 4, movetoworkspacesilent, 14 # MOVE FOCUSED WINDOW TO WORKSPACE 14 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift+Ctrl, 5, movetoworkspacesilent, 15 # MOVE FOCUSED WINDOW TO WORKSPACE 15 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift+Ctrl, 6, movetoworkspacesilent, 16 # MOVE FOCUSED WINDOW TO WORKSPACE 16 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift+Ctrl, 7, movetoworkspacesilent, 17 # MOVE FOCUSED WINDOW TO WORKSPACE 17 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift+Ctrl, 8, movetoworkspacesilent, 18 # MOVE FOCUSED WINDOW TO WORKSPACE 18 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift+Ctrl, 9, movetoworkspacesilent, 19 # MOVE FOCUSED WINDOW TO WORKSPACE 19 AND STAY ON CURRENT WORKSPACE
bind = $mainMod+Shift+Ctrl, 0, movetoworkspacesilent, 20 # MOVE FOCUSED WINDOW TO WORKSPACE 20 AND STAY ON CURRENT WORKSPACE



