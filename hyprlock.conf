general {
    disable_loading_bar    = true
    hide_cursor            = true
    grace                  = 0
    no_fade_in             = false
    no_fade_out            = false
    ignore_empty_input     = false
}

background {
    monitor     =
    path        = screenshot
    blur_passes = 3
    blur_size   = 7
    noise       = 0.0117
    contrast    = 0.8916
    brightness  = 0.8172
    vibrancy    = 0.1696
    vibrancy_darkness = 0.0
}

label {
    monitor     =
    text        = cmd[update:1000] echo "$(date +"%H:%M")"
    color       = rgba(C0CAF5FF)
    font_size   = 96
    font_family = JetBrains Mono ExtraBold

    position    = 0, 220
    halign      = center
    valign      = center

    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = rgba(00000088)
    shadow_boost  = 1.2
}

label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +"%A, %B %-d")"
    color       = rgba(A9B1D6CC)
    font_size   = 20
    font_family = JetBrains Mono

    position    = 0, 130
    halign      = center
    valign      = center

    shadow_passes = 1
    shadow_size   = 3
    shadow_color  = rgba(00000066)
}

label {
    monitor     =
    text        = Hi there, $USER
    color       = rgba(7DCFFFBB)
    font_size   = 14
    font_family = JetBrains Mono

    position    = 0, 60
    halign      = center
    valign      = center
}

input-field {
    monitor     =
    size        = 300, 52
    position    = 0, -60
    halign      = center
    valign      = center

    outline_thickness  = 2
    dots_size          = 0.28
    dots_spacing       = 0.18
    dots_center        = true
    dots_rounding      = -1       # -1 = circle

    # colours — Tokyo Night palette
    outer_color        = rgba(3B4261FF)
    inner_color        = rgba(1A1B26CC)
    font_color         = rgba(C0CAF5FF)
    check_color        = rgba(7AA2F7FF)
    fail_color         = rgba(F7768EFF)
    capslock_color     = rgba(E0AF68FF)

    fade_on_empty      = true
    fade_timeout       = 1200

    placeholder_text   = <i>password…</i>
    hide_input         = false
    rounding           = 12

    fail_text          = <i>$FAIL ($ATTEMPTS)</i>
    fail_transition    = 300

}

label {
    monitor     =
    text        =   # nerd-font lock icon (U+F023); replace with 󰌾 if preferred
    color       = rgba(3B4261FF)
    font_size   = 18
    font_family = JetBrainsMono Nerd Font

    position    = 0, -128
    halign      = center
    valign      = center
}
