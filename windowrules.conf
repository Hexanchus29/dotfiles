windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

windowrule {
  name = force-opaque
  match:tag = forceopaque
  opacity = 1.0
}

windowrule {
  name = Qalculate!
  match:class = qalculate-gtk
  size = 752,737
  float = on
  center = on
  workspace = current
}

windowrule {
  name = hyprland-share-picker
  match:class = hyprland-share-picker
  size = 781 789
  float = on
  center = on
}

windowrule {
  name = Open Files
  match:title = Open Files 
  size = 1245,1109
  float = on
  center = on
}

windowrule {
  name = Create Snapshot
  match:title = Create Snapshot
  size = 781 789
  float = on
  center = on
}

windowrule {
  name = Restore Snapshot
  match:title = Restore Snapshot
  size = 781 789
  float = on
  center = on
}

windowrule {
  name = Delete Snapshots
  match:title = Delete Snapshots
  size = 781 789
  float = on
  center = on
}

# Opacity window rules
windowrule = opacity 0.9 0.9, match:class vesktop
windowrule = opacity 0.9 0.9, match:class ws3dash
windowrule = opacity 0.9 0.9, match:title New Tab - Helium
windowrule = opacity 0.9 0.9, match:class spotify
windowrule = opacity 0.9 0.9, match:title LibreWolf
windowrule = opacity 0.9 0.9, match:title New Tab — LibreWolf
windowrule = opacity 0.9 0.9, match:class foot

# Window rules for apps to start in a specific workspace
windowrule = workspace 2 silent, match:class steam
windowrule = workspace 4 silent, match:class librewolf
windowrule = workspace 2 silent, match:class heroic
windowrule = workspace 1 silent, match:class vesktop
windowrule = workspace 1 silent, match:initial_title Discord
windowrule = workspace 1 silent, match:class spotify
windowrule = workspace 2 silent, match:class org.prismlauncher.PrismLauncher
windowrule = workspace 5 silent, match:class cs2
windowrule = workspace 5 silent, match:class Slay the Spire
windowrule = workspace 5 silent, match:class dotnet
windowrule = workspace 4 silent, match:class org.mozilla.Thunderbird
windowrule = workspace 2 silent, match:class r2modman
windowrule = workspace 5 silent, match:class Skyblocker Modpack.*
windowrule = workspace 4 silent, match:class helium
windowrule = workspace 3 silent, match:class ws3dash
windowrule = workspace 5 silent, match:class Stardew Valley

# Misc window rules
windowrule = fullscreen on, match:class ^(csgo_linux64)$
windowrule = immediate on, match:class ^(csgo_linux64)$
windowrule = no_anim on, match:class ^(csgo_linux64)$
windowrule = no_anim on, match:class cs2
windowrule = fullscreen on, match:class cs2
windowrule = immediate on, match:class cs2
windowrule = fullscreen on, match:class org.mozilla.Thunderbird

# Steam games (AppID windows)
windowrule = workspace 5 silent, match:class ^steam_app_\d+$
windowrule = workspace 5 silent, match:initial_class ^steam_app_\d+$
windowrule = workspace 5 silent, match:title ^steam_app_\d+$
windowrule = workspace 5 silent, match:initial_title ^steam_app_\d+$
windowrule = workspace 5 silent, match:class ^gamescope$
windowrule = workspace 5 silent, match:initial_class ^gamescope$
windowrule = workspace 5 silent, match:class ^(wine|Wine|explorer\.exe|steam_proton|proton)$
windowrule = workspace 5 silent, match:initial_class ^(wine|Wine|explorer\.exe|steam_proton|proton)$
windowrule = workspace 5 silent, match:title ^(DXVK|vkd3d|VKD3D).*
windowrule = workspace 5 silent, match:initial_title ^(DXVK|vkd3d|VKD3D).*
windowrule = workspace 5 silent, match:title .*(Unity|Unreal Engine|UE4|UE5|Godot|GZDoom|Source|Source 2|SDL2|OpenGL|Vulkan).*
windowrule = workspace 5 silent, match:initial_title .*(Unity|Unreal Engine|UE4|UE5|Godot|GZDoom|Source|Source 2|SDL2|OpenGL|Vulkan).*
